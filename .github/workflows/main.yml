name: Build RNV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build RNV Debug APK
        run: ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "=== APK INFORMATION ==="
          ls -lh "$APK"
          file "$APK"

      - name: Verify APK ZIP
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -t "$APK"

      - name: Verify APK Signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner \
            -type f | sort -V | tail -1)

          echo "Using: $APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Show APK Contents
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | head -100

      - name: Upload RNV APK
        uses: actions/upload-artifact@v4
        with:
          name: RNV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
